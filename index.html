<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QXVbrand - Andijon Namoz Vaqtlari & Ismlar Ma'nosi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #080808;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Weather / Season Background Canvas */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            transition: filter 1s ease, background 1s ease;
        }

        /* Seasonal background overlay classes */
        .season-winter {
            background: linear-gradient(180deg, #050a14 0%, #0d1b2a 100%);
        }
        .season-spring {
            background: linear-gradient(180deg, #091a0f 0%, #0d2b18 100%);
        }
        .season-summer {
            background: linear-gradient(180deg, #1f1200 0%, #080808 100%);
        }
        .season-autumn {
            background: linear-gradient(180deg, #1c0a00 0%, #080808 100%);
        }

        /* Rain Overlay Animation */
        .rain-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
        }

        .drop {
            position: absolute;
            background: linear-gradient(transparent, rgba(212, 175, 55, 0.4));
            width: 1px;
            height: 40px;
            opacity: 0.6;
            animation: fall 1s linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-100px); }
            100% { transform: translateY(100vh); }
        }

        /* 5-Second Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            transition: opacity 1s ease, visibility 1s ease;
        }

        .splash-title {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
            margin-bottom: 15px;
            animation: pulse 1.5s infinite alternate;
        }

        .splash-quote {
            font-size: 1.2rem;
            color: #e0e0e0;
            margin-bottom: 25px;
            font-style: italic;
            max-width: 80%;
            line-height: 1.5;
        }

        .splash-countdown {
            font-size: 4rem;
            font-weight: bold;
            color: #d4af37;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.8);
        }

        @keyframes pulse {
            0% { transform: scale(0.98); }
            100% { transform: scale(1.02); }
        }

        /* Main Container */
        .main-content {
            position: relative;
            z-index: 10;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .main-content.visible {
            opacity: 1;
        }

        .card {
            background: rgba(18, 18, 18, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            margin-bottom: 20px;
            text-align: center;
        }

        .brand-header {
            font-size: 1.8rem;
            font-weight: bold;
            color: #d4af37;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .location-sub {
            color: #aaaaaa;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .season-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            border: 1px solid #d4af37;
            color: #d4af37;
            font-size: 0.8rem;
            margin-bottom: 15px;
            background: rgba(212, 175, 55, 0.1);
        }

        .prayer-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .prayer-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 30, 30, 0.7);
            padding: 12px 16px;
            border-radius: 10px;
            border-left: 3px solid transparent;
            transition: all 0.3s;
        }

        .prayer-item.active {
            border-left-color: #d4af37;
            background: rgba(212, 175, 55, 0.15);
        }

        .prayer-name {
            font-weight: 600;
        }

        .prayer-time {
            font-weight: 700;
            color: #d4af37;
        }

        .action-btn {
            background: linear-gradient(135deg, #bf953f, #aa820a);
            color: #000;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            transition: transform 0.2s;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        /* Name Meaning Section */
        .search-box {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .search-input {
            flex: 1;
            background: rgba(30, 30, 30, 0.9);
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            outline: none;
        }

        .search-input:focus {
            border-color: #d4af37;
        }

        .meaning-result {
            margin-top: 15px;
            padding: 12px;
            background: rgba(30, 30, 30, 0.5);
            border-radius: 8px;
            font-size: 0.95rem;
            color: #ddd;
            min-height: 50px;
        }
    </style>
</head>
<body class="season-winter">

    <div id="bg-canvas"></div>
    <div class="rain-container" id="rain"></div>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="splash-title">QXVbrand</div>
        <div class="splash-quote">"Sabr va namoz jannat kalitidir"</div>
        <div class="splash-countdown" id="countdown">5</div>
    </div>

    <!-- Main Application -->
    <div class="main-content" id="main-content">
        
        <!-- Prayer Times Card -->
        <div class="card">
            <div class="brand-header">QXVbrand</div>
            <div class="location-sub">Andijon Viloyati Namoz Vaqtlari</div>
            <div class="season-badge" id="season-name">Fasl: Qish</div>

            <div class="prayer-list">
                <div class="prayer-item" id="card-Fajr"><span class="prayer-name">Bomdod</span><span class="prayer-time" id="time-Fajr">--:--</span></div>
                <div class="prayer-item" id="card-Dhuhr"><span class="prayer-name">Peshin</span><span class="prayer-time" id="time-Dhuhr">--:--</span></div>
                <div class="prayer-item" id="card-Asr"><span class="prayer-name">Asr</span><span class="prayer-time" id="time-Asr">--:--</span></div>
                <div class="prayer-item" id="card-Maghrib"><span class="prayer-name">Shom</span><span class="prayer-time" id="time-Maghrib">--:--</span></div>
                <div class="prayer-item" id="card-Isha"><span class="prayer-name">Xufton</span><span class="prayer-time" id="time-Isha">--:--</span></div>
            </div>

            <button class="action-btn" onclick="enableAudio()">Ovozni va Azonni Yoqish</button>
            <div id="status-text" style="font-size: 11px; color: #888; margin-top: 10px;">Azon ovozi chiqishi uchun bir marta bosing</div>
        </div>

        <!-- Name Dictionary Card -->
        <div class="card">
            <div style="font-weight: bold; color: #d4af37; margin-bottom: 10px;">Ismlar Ma'nosi Lug'ati</div>
            <div class="search-box">
                <input type="text" id="name-input" class="search-input" placeholder="Ism kiriting (masalan: Muhammad, Sabr)">
                <button class="action-btn" style="width: auto; padding: 10px 15px;" onclick="searchName()">Izlash</button>
            </div>
            <div class="meaning-result" id="meaning-output">Ism ma'nosini bilish uchun yuqoriga yozing.</div>
        </div>

    </div>

    <audio id="azanaudio" src="https://cdn.islamic.network/quran/audio/128/ar.alafasy/1.mp3" preload="auto"></audio>

    <script>
        // 1. Splash Countdown
        let count = 5;
        const countdownEl = document.getElementById('countdown');
        const splashEl = document.getElementById('splash-screen');
        const mainContent = document.getElementById('main-content');

        const timer = setInterval(() => {
            count--;
            if (count > 0) {
                countdownEl.innerText = count;
            } else {
                clearInterval(timer);
                splashEl.style.opacity = '0';
                splashEl.style.visibility = 'hidden';
                mainContent.classList.add('visible');
            }
        }, 1000);

        // 2. Dynamic Rain Drops
        const rainContainer = document.getElementById('rain');
        for (let i = 0; i < 40; i++) {
            const drop = document.createElement('div');
            drop.className = 'drop';
            drop.style.left = Math.random() * 100 + 'vw';
            drop.style.animationDuration = (0.5 + Math.random() * 0.5) + 's';
            drop.style.animationDelay = Math.random() * 2 + 's';
            rainContainer.appendChild(drop);
        }

        // 3. Seasonal background switch every 10 seconds
        const seasons = [
            { class: 'season-winter', name: 'Fasl: Qish' },
            { class: 'season-spring', name: 'Fasl: Bahor' },
            { class: 'season-summer', name: 'Fasl: Yoz' },
            { class: 'season-autumn', name: 'Fasl: Kuz' }
        ];
        let seasonIndex = 0;

        setInterval(() => {
            document.body.className = seasons[seasonIndex].class;
            document.getElementById('season-name').innerText = seasons[seasonIndex].name;
            seasonIndex = (seasonIndex + 1) % seasons.length;
        }, 10000);

        // 4. Prayer Times for Andijan
        let timesData = {};
        let audioEnabled = false;

        async function fetchPrayerTimes() {
            try {
                const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Andijan&country=Uzbekistan&method=3');
                const data = await res.json();
                timesData = data.data.timings;

                document.getElementById('time-Fajr').innerText = timesData.Fajr;
                document.getElementById('time-Dhuhr').innerText = timesData.Dhuhr;
                document.getElementById('time-Asr').innerText = timesData.Asr;
                document.getElementById('time-Maghrib').innerText = timesData.Maghrib;
                document.getElementById('time-Isha').innerText = timesData.Isha;
            } catch (e) {
                document.getElementById('status-text').innerText = "Vaqtlarni yuklashda xatolik yuz berdi.";
            }
        }

        function enableAudio() {
            const audio = document.getElementById('azanaudio');
            audio.play().then(() => {
                audio.pause();
                audio.currentTime = 0;
                audioEnabled = true;
                document.getElementById('status-text').innerText = "Ovoz aktivlashtirildi ✓";
            }).catch(err => {
                console.log(err);
            });
        }

        setInterval(() => {
            const now = new Date();
            const currentHM = now.toTimeString().substring(0, 5);
            const prayers = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];

            prayers.forEach(p => {
                if (timesData[p] === currentHM) {
                    document.getElementById(`card-${p}`).classList.add('active');
                    if (audioEnabled) {
                        const audio = document.getElementById('azanaudio');
                        audio.play();
                    }
                } else {
                    document.getElementById(`card-${p}`).classList.remove('active');
                }
            });
        }, 10000);

        fetchPrayerTimes();

        // 5. Islamic Name Dictionary
        const nameDictionary = {
            "muhammad": "Maqtovga loyiq, ulug'langan. Payg'ambarimiz (s.a.v.) ismi.",
            "sabr": "Chidamli, sabr-toqatli, matonatli.",
            "ali": "Oliy, yuksak, martabasi baland.",
            "umar": "Hayot, yashash, uzoq umr ko'ruvchi.",
            "usmon": "To'g'rilik, g'amxo'r, mehribon.",
            "aziz": "Qadrli, izzatli, qudratli.",
            "madina": "Shaharlik, madaniyatli. Muqaddas shahar nomi.",
            "oxun": "Ustoz, bilimdon, ilmli kishi."
        };

        function searchName() {
            const input = document.getElementById('name-input').value.trim().toLowerCase();
            const output = document.getElementById('meaning-output');

            if (!input) {
                output.innerText = "Iltimos, ism kiriting.";
                return;
            }

            if (nameDictionary[input]) {
                output.innerText = `${input.toUpperCase()}: ${nameDictionary[input]}`;
            } else {
                output.innerText = `"${input}" ismi lug'atdan topilmadi. Boshqa ism sinab ko'ring.`;
            }
        }
    </script>
</body>
</html>
